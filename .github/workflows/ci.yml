name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: SQLite version floor
        run: |
          python - <<'PY'
          import sqlite3
          import sys

          version = tuple(int(part) for part in sqlite3.sqlite_version.split("."))
          print(sys.version.split()[0], sqlite3.sqlite_version)
          if version < (3, 37):
              raise SystemExit("SQLite 3.37 or newer is required for STRICT tables")
          PY

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest

      - name: CLI smoke checks
        run: |
          python -m disclosure_drift --help
          python -m disclosure_drift validate-config
          python -m disclosure_drift show-cohorts
          python -m disclosure_drift sec --help

      - name: Secret scan
        run: python scripts/check_no_secrets.py

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py
