name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job builds a fresh virtual environment before installing anything. The
# core job's "httpx must be absent" assertion is only meaningful in an isolated
# interpreter, so the hosted runner's global package state is never relied upon.
#
# The environments live under RUNNER_TEMP, never inside the checkout. The secret
# and hygiene gates enumerate work through
# `git ls-files --cached --others --exclude-standard`, so any directory created
# inside the checkout that is not ignored is in scope. A virtual environment
# there means the gates read thousands of installed third-party files and report
# their maintainer addresses and fixture credentials as findings. Keeping the
# environment outside the repository removes the cause instead of excluding the
# files, so the scanners keep their full, unweakened scope over project sources.

jobs:
  # ------------------------------------------------------------------------- #
  # Core environment: base package only, no [sec] extra, no httpx.
  # Proves the package is usable and auditable without the HTTP client.
  # ------------------------------------------------------------------------- #
  core:
    name: Core environment (no [sec] extra)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create an isolated virtual environment outside the checkout
        run: |
          test -n "$RUNNER_TEMP" || {
            echo "RUNNER_TEMP is unset; refusing to create a virtual environment"
            echo "inside the repository checkout, which the secret and hygiene"
            echo "gates would then scan." >&2
            exit 1
          }
          python -m venv --clear "$RUNNER_TEMP/venv-core"
          echo "$RUNNER_TEMP/venv-core/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv-core" >> "$GITHUB_ENV"

      - name: Confirm isolation before installing anything
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          assert sys.prefix != sys.base_prefix, "not running inside the virtual environment"
          print("interpreter:", sys.executable)
          for forbidden in ("httpx", "pyarrow", "disclosure_drift"):
              if importlib.util.find_spec(forbidden) is not None:
                  raise SystemExit(
                      f"{forbidden} leaked into the fresh environment before install"
                  )
          print("fresh environment confirmed empty of httpx, pyarrow, disclosure_drift")
          PY

      - name: Install base package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert httpx is absent and PyArrow is not installed
        run: |
          python - <<'PY'
          import importlib.util

          for forbidden in ("httpx", "pyarrow"):
              if importlib.util.find_spec(forbidden) is not None:
                  raise SystemExit(f"{forbidden} must not be installed in the core job")
          print("core environment clean: no httpx, no pyarrow")
          PY

      - name: Ordinary imports must not pull in httpx
        run: |
          python - <<'PY'
          import sys

          import disclosure_drift
          from disclosure_drift.sec import http_client, source_registry, temporal, urls  # noqa: F401

          assert "httpx" not in sys.modules, "importing package modules loaded httpx"
          print("no HTTP client imported by ordinary modules")
          PY

      - name: Live transport without the extra raises the documented error
        run: |
          python - <<'PY'
          from disclosure_drift.sec.httpx_transport import HTTPX_INSTALL_HINT, HttpxTransport
          from disclosure_drift.sec.transport import TransportUnavailableError

          try:
              HttpxTransport()
          except TransportUnavailableError as exc:
              assert "dev,sec" in str(exc), str(exc)
              print("documented actionable error:", HTTPX_INSTALL_HINT)
          else:
              raise SystemExit("HttpxTransport must refuse to construct without httpx")
          PY

      - name: Offline commands work without the extra
        run: |
          python -m disclosure_drift --help
          python -m disclosure_drift validate-config
          python -m disclosure_drift show-cohorts
          python -m disclosure_drift sec --help

      - name: Focused optional-dependency suite
        run: pytest -q tests/unit/test_optional_dependencies.py

  # ------------------------------------------------------------------------- #
  # SEC-enabled environment: the required check. Runs the whole suite and must
  # actually exercise the httpx adapter; a skip here is a failure.
  # ------------------------------------------------------------------------- #
  sec-enabled:
    name: SEC-enabled environment ([dev,sec]) — required
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create an isolated virtual environment outside the checkout
        run: |
          test -n "$RUNNER_TEMP" || {
            echo "RUNNER_TEMP is unset; refusing to create a virtual environment"
            echo "inside the repository checkout, which the secret and hygiene"
            echo "gates would then scan." >&2
            exit 1
          }
          python -m venv --clear "$RUNNER_TEMP/venv-sec"
          echo "$RUNNER_TEMP/venv-sec/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv-sec" >> "$GITHUB_ENV"

      - name: Confirm isolation before installing anything
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          assert sys.prefix != sys.base_prefix, "not running inside the virtual environment"
          print("interpreter:", sys.executable)
          for forbidden in ("httpx", "pyarrow", "disclosure_drift"):
              if importlib.util.find_spec(forbidden) is not None:
                  raise SystemExit(
                      f"{forbidden} leaked into the fresh environment before install"
                  )
          print("fresh environment confirmed empty before installing the extra")
          PY

      - name: Install with the approved SEC extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sec]"

      - name: Assert httpx is present and PyArrow is still absent
        run: |
          python -c "import httpx; print('httpx', httpx.__version__)"
          python -c "import importlib.util; assert importlib.util.find_spec('pyarrow') is None"

      - name: SQLite version floor
        run: |
          python - <<'PY'
          import sqlite3
          import sys

          version = tuple(int(part) for part in sqlite3.sqlite_version.split("."))
          print(sys.version.split()[0], sqlite3.sqlite_version)
          if version < (3, 37):
              raise SystemExit("SQLite 3.37 or newer is required for STRICT tables")
          PY

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: Transport suite must execute, not skip
        run: pytest -q tests/unit/test_httpx_transport.py -rs

      - name: Full pytest suite
        run: pytest -q -rs

      - name: CLI smoke checks
        run: |
          python -m disclosure_drift --help
          python -m disclosure_drift validate-config
          python -m disclosure_drift show-cohorts
          python -m disclosure_drift sec --help

      - name: Secret scan
        run: python scripts/check_no_secrets.py

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py
