[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "disclosure-drift"
dynamic = ["version"]
description = "Reproducible research foundation for the Disclosure Drift temporal-reliability study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Joseph Nihill" }]
keywords = ["research", "reproducibility", "sec-filings", "temporal-drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
# Declared now, installed later. Stage M2.1 imports neither.
# sec: SEC HTTP client, introduced in Stage M2.2 and confined to one auditable module.
sec = ["httpx>=0.27,<1"]
# release: deterministic Parquet writer, introduced in Stage M2.7.
release = ["pyarrow>=17"]

[project.scripts]
disclosure-drift = "disclosure_drift.cli:run"

# The canonical version lives in the package itself; nothing declares it twice.
[tool.hatch.version]
path = "src/disclosure_drift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_drift"]
# Versioned migrations ship as package data and are read with importlib.resources.
artifacts = ["src/disclosure_drift/storage/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Docs", "Literature", "Milestones", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "C4",   # comprehensions
  "RET",  # return consistency
  "PTH",  # prefer pathlib
  "ANN",  # type annotations
  "S",    # bandit security checks
  "TID",  # tidy imports
  "EM",   # exception message hygiene
  "N",    # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN401"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/disclosure_drift"]
branch = true
